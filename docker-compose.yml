services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: preader
      POSTGRES_PASSWORD: preader
      POSTGRES_DB: preader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preader"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://preader:preader@db:5432/preader
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}

volumes:
  pgdata:
